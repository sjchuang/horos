<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="stylesheet" href="/static/controls.css?v=1">
<script src="/static/controls.js?v=1" defer></script>
<title>horos — annotate</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2129; --line: #2a333e;
    --text: #e6edf3; --dim: #8b98a5; --accent: #0a84ff; --ok: #51cf66; --err: #ff6b6b;
    --warn: #fcc419;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--dim); text-decoration: none; }
  a:hover { color: var(--accent); }
  .btn { background: var(--panel); color: var(--text); border: 1px solid var(--line);
         border-radius: 10px; padding: 8px 16px; cursor: pointer; font-size: 14px;
         display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.primary.big { font-size: 17px; padding: 14px 28px; border-radius: 14px; }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn svg { width: 18px; height: 18px; }
  select, input[type=text] { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  select:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 2px; background: var(--line); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  h4 { margin: 0 0 10px; font-size: 11px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .08em; }

  /* ---- shared site header (identical on every page) ---- */
  .site-header { position: sticky; top: 0; z-index: 40; background: var(--bg);
                 display: flex; align-items: center; gap: 14px;
                 padding: 10px 24px; border-bottom: 1px solid var(--line); }
  .site-header h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  .site-header .project { color: var(--dim); }
  .site-header .page-nav { margin-left: auto; }
  .page-nav { display: flex; gap: 8px; }
  .page-nav a { position: relative; display: flex; align-items: center; justify-content: center;
                width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px;
                color: var(--dim); }
  .page-nav a:hover { border-color: var(--accent); color: var(--accent); }
  .page-nav a[aria-current] { color: var(--text); border-color: var(--accent);
                              background: rgba(77, 171, 247, .12); }
  .page-nav a::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px);
                       right: 0; z-index: 30; background: var(--panel); border: 1px solid var(--line);
                       border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text);
                       white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .page-nav a:hover::after { opacity: 1; }
  .page-nav svg { width: 18px; height: 18px; }

  /* ---- stepper bar: the four steps of a round ---- */
  .steps { display: flex; align-items: center; justify-content: center; gap: 0;
           padding: 22px 16px 10px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--dim); }
  .step .n { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
             display: flex; align-items: center; justify-content: center; font-weight: 600;
             background: var(--bg); }
  .step .n svg { width: 18px; height: 18px; }
  .step .t { font-size: 13px; letter-spacing: .02em; }
  .step.on { color: var(--text); }
  .step.on .n { border-color: var(--accent); color: var(--accent);
                box-shadow: 0 0 0 4px rgba(77, 171, 247, .15); }
  .step.done .n { border-color: var(--ok); color: var(--ok); }
  .step-line { width: 70px; height: 2px; background: var(--line); margin: 0 12px; }
  .step-line.done { background: var(--ok); }

  main { max-width: 1180px; margin: 0 auto; padding: 8px 24px 40px; }
  .panel { display: none; }
  .panel.on { display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--dim); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .stat .k svg { width: 14px; height: 14px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--dim); border: none; padding: 6px 12px;
                cursor: pointer; font-size: 13px; }
  .seg button.on { background: rgba(77, 171, 247, .15); color: var(--accent); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
           border: 1px solid var(--line); font-size: 12px; color: var(--dim); position: relative; }
  .badge svg { width: 14px; height: 14px; }
  .options { justify-content: center; gap: 22px; margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 8px; }
  .opt .k { color: var(--dim); font-size: 12px; }
  .opt select { font-size: 12px; padding: 5px 8px; }
  .badge.accent { border-color: var(--accent); color: var(--accent); }
  .bar { background: var(--line); height: 10px; border-radius: 5px; overflow: hidden; }
  .bar > div { background: var(--accent); height: 100%; width: 0; transition: width .3s; }
  .muted { color: var(--dim); font-size: 12px; }
  .notes { color: var(--dim); font-size: 12px; margin: 8px 0 0; padding-left: 18px; }
  .ring { width: 92px; height: 92px; }
  .label-bar { padding: 8px 14px; }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .bar.thin { height: 6px; flex: 1; }
  .bar.thin > div { background: var(--ok); }
  .ring text { fill: var(--text); font-size: 17px; font-weight: 600; }
  .ring .track { stroke: var(--line); }
  .ring .fill { stroke: var(--ok); transition: stroke-dasharray .3s; }
  .label-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; margin-top: 14px; }
  iframe#annotator { width: 100%; height: calc(100vh - 172px); min-height: 480px; border: 1px solid var(--line);
                     border-radius: 12px; background: var(--bg); }
  body.label-expanded iframe#annotator { height: calc(100vh - 330px); }
  .reasons { margin: 8px 0 0; padding: 0; list-style: none; }
  .reasons li { display: flex; gap: 8px; align-items: center; color: var(--warn); font-size: 12px; margin: 4px 0; }
  .reasons li svg { width: 14px; height: 14px; flex: none; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .name { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line); font-size: 12px;
          color: var(--dim); cursor: pointer; }
  .name.on { border-color: var(--accent); color: var(--accent); }
  #chart { width: 100%; height: 240px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .legend .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--ok); } .down { color: var(--err); }
  .metric-big { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .advice { border-left: 4px solid var(--accent); padding: 6px 14px; border-radius: 6px; background: rgba(10,132,255,.06); }
  .advice.ok { border-color: var(--ok); background: rgba(48,209,88,.08); }
  .advice.warn { border-color: var(--warn); background: rgba(255,214,10,.08); }
  .advice.err { border-color: var(--err); background: rgba(255,69,58,.08); }
  .advice-title { font-size: 20px; font-weight: 600; }
  .advice .reasons li { color: var(--dim); }
  #spark { width: 100%; height: 200px; display: block; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; display: none; z-index: 1200; }
  #toast.warn { border-color: var(--warn); color: var(--warn); }
  #toast.err { border-color: var(--err); color: var(--err); }
  #toast.ok { border-color: var(--ok); color: var(--ok); }
  .tip { position: relative; }
  .tip::after { content: attr(data-tip); position: absolute; left: 50%; transform: translateX(-50%);
                top: calc(100% + 8px); background: var(--panel); border: 1px solid var(--line);
                border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text);
                white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 20; }
  .tip:hover::after { opacity: 1; }
  @media (max-width: 900px) { .label-layout { grid-template-columns: 1fr; } .step .t { display: none; }
                              .step-line { width: 30px; } }
</style>
</head>
<body>

<header class="site-header">
  <h1 style="display:flex;align-items:center;gap:9px">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M7 22 L7 9 Q7 7 9 7 L22 7" fill="none" stroke="#e6edf3"
            stroke-width="4.6" stroke-linecap="round"/>
      <rect x="17" y="17" width="9" height="9" rx="2.2" fill="#4dabf7"/></svg>
    horos</h1>
  <span class="project" id="project-name">—</span>
  <nav class="page-nav">
    <a href="/" data-tip="Dataset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="8" ry="3"/>
        <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
        <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></a>
    <a href="/annotate" data-tip="Annotate" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></a>
    <a href="/train" data-tip="Training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></a>
    <a href="/evaluate" data-tip="Evaluate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg></a>
    <a href="/experiments" data-tip="Experiments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="5" height="9" rx="1"/>
        <rect x="9.5" y="4" width="5" height="16" rx="1"/>
        <rect x="16" y="8" width="5" height="12" rx="1"/></svg></a>
    <a href="/lab" data-tip="Lab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6"/><path d="M10 3v6.5L4.6 18.4A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.6L14 9.5V3"/>
        <path d="M7.5 14h9"/></svg></a>
  </nav>
</header>

<!-- ============================== the four steps ============================== -->
<div class="steps" id="steps">
  <div class="step" data-step="1"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span><span class="t">Select</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="2"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span><span class="t">Label</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="3"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span><span class="t">Train</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="4"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/></svg></span><span class="t">Review</span></div>
</div>

<main>
  <!-- ------------------------------------------------------------ 1 select -->
  <section class="panel card" id="panel-select">
    <div class="stats" id="select-stats"></div>
    <div class="center" style="margin-top:26px">
      <div class="row" style="justify-content:center;width:100%;max-width:640px">
        <div class="seg" id="unit-seg">
          <button class="on" data-unit="count" title="a fixed number of images">#</button>
          <button data-unit="percent" title="a share of the unlabeled pool">%</button>
        </div>
        <input type="range" id="count-slider" class="grow" min="1" max="100" step="1" value="20">
        <span class="stepper wide"><input type="number" id="count-input" min="1" max="100" step="1" value="20">
          <span class="step-btns"><button type="button" data-step="1"></button>
            <button type="button" data-step="-1"></button></span></span>
      </div>
      <div class="row" style="justify-content:center">
        <span class="badge tip" id="strategy-badge" data-tip=""></span>
      </div>
      <div class="row options loop-options"></div>
      <button class="btn primary big" id="btn-select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="btn-select-text">Pick 20 photos</span></button>
      <div id="select-progress" style="display:none;width:100%;max-width:640px">
        <div class="bar"><div id="select-bar"></div></div>
        <div class="row" style="margin-top:8px">
          <span class="muted grow" id="select-text">starting…</span>
          <button class="btn danger" id="btn-select-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <a class="btn" href="/annotate?canvas=1" title="Browse and edit every photo">All photos</a>
    </div>
    <details style="margin-top:18px" id="history-details">
      <summary class="muted" style="cursor:pointer">History</summary>
      <div id="history-table-1" style="margin-top:8px"></div>
    </details>
  </section>

  <!-- ------------------------------------------------------------- 2 label -->
  <section class="panel" id="panel-label">
    <!-- a slim bar while labeling: progress + Train; everything else folds away -->
    <div class="card label-bar" id="label-bar">
      <div class="row" style="gap:12px;flex-wrap:nowrap">
        <span class="badge" id="round-badge" style="flex:none">round —</span>
        <div class="progress grow" title="labeled photos in this round">
          <div class="bar thin"><div id="ring-fill"></div></div>
          <span class="muted" id="ring-text" style="flex:none;font-variant-numeric:tabular-nums">0/0</span>
        </div>
        <span class="badge tip" id="prelabel-badge" data-tip="" style="display:none;flex:none"></span>
        <span class="muted" id="reasons-compact" style="flex:none;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button class="btn primary" id="btn-train" disabled style="flex:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Train</button>
        <button class="btn" id="btn-expand" title="More options" aria-expanded="false" style="padding:8px 10px">
          <svg id="expand-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div id="label-more" hidden style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <div class="row options loop-options" style="justify-content:flex-start"></div>
        <div class="row" style="margin-top:12px">
          <input type="text" id="annotators-input" placeholder="Who is labeling? ann, bob" style="width:240px">
          <button class="btn" id="btn-assign" title="Share the round between these people">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
          <div class="names" id="names"></div>
          <span class="grow"></span>
          <a class="btn" href="/annotate?canvas=1" title="Browse and edit every photo">All photos</a>
          <button class="btn" id="btn-discard" title="Drop this round and pick again">↺ Re-pick</button>
        </div>
        <ul class="reasons" id="reasons"></ul>
      </div>
    </div>
    <iframe id="annotator" title="annotator" style="margin-top:10px"></iframe>
  </section>

  <!-- ------------------------------------------------------------- 3 train -->
  <section class="panel card" id="panel-train">
    <div class="row">
      <span class="badge" id="train-badge">round —</span>
      <span class="muted grow" id="train-text">starting…</span>
      <button class="btn danger" id="btn-stop">■ Stop</button>
    </div>
    <div class="bar" style="margin:12px 0"><div id="train-bar"></div></div>
    <div class="row" id="metric-chips" style="margin-bottom:10px;min-height:30px"></div>
    <canvas id="chart"></canvas>
    <div class="legend" id="chart-legend"></div>
  </section>

  <!-- ------------------------------------------------------------ 4 review -->
  <section class="panel card" id="panel-review">
    <div class="advice" id="advice">
      <div class="advice-title" id="advice-title">—</div>
      <div class="muted" id="advice-reason" style="margin-top:4px"></div>
      <ul class="reasons" id="advice-findings" style="margin-top:6px"></ul>
    </div>
    <div class="row" style="align-items:flex-start;margin-top:18px">
      <div class="grow">
        <div class="row" style="align-items:baseline;gap:10px">
          <span class="metric-big" id="metric-value">—</span>
          <span id="metric-delta" style="font-size:20px"></span>
        </div>
        <div class="muted" id="metric-key"></div>
        <h4 style="margin:16px 0 6px">Learning curve · train vs test mAP@50 by labeled photos</h4>
        <canvas id="spark"></canvas>
        <div class="legend" id="curve-legend"></div>
        <div class="muted" id="curve-note"></div>
      </div>
      <div class="stats" style="min-width:300px" id="review-stats"></div>
    </div>
    <div id="history-table" style="margin-top:16px"></div>
    <div class="row" style="justify-content:center;margin-top:22px;gap:14px">
      <button class="btn primary big" id="btn-next-round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/>
          <polyline points="21 3 21 9 15 9"/><polyline points="3 21 3 15 9 15"/></svg>
        Next round</button>
      <button class="btn" id="btn-finish">✓ Done</button>
      <a class="btn" id="link-evaluate" href="/evaluate">Evaluate</a>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts) => fetch("/api/v1" + path, opts).then(async (r) => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.message || body.error || r.statusText); e.status = r.status; throw e; }
  return body;
});
const json = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
function toast(msg, cls = "warn", ms = 2600) {
  const el = $("toast"); el.textContent = msg; el.className = cls; el.style.display = "block";

  // ------------------------------------------------------------ state

  showStep(step, cur) {

  async pollTrain() {
    const cur = this.status.current;
    try {
      const body = await api(`/loop/rounds/${cur.number}/training?after=${this.seen}`);
      const t = body.training;
      if (t) {
        this.seen = t.num_events;
        for (const ev of t.events) {
          if (ev.type === "metrics") {
            for (const [k, v] of Object.entries(ev.metrics)) (this.series[k] = this.series[k] || []).push([ev.step, v]);
          } else if (ev.type === "progress" && ev.total && /epoch/i.test(ev.phase || "")) {
            this.epochs = [ev.current, ev.total];
            $("train-bar").style.width = (100 * ev.current / ev.total) + "%";
          } else if (ev.type === "progress" && !/epoch/i.test(ev.phase || "")) {
            $("train-text").textContent = ev.phase + (ev.message ? " — " + ev.message : "");
          } else if (ev.type === "warning") toast(ev.message, "warn", 4000);
        }
        if (this.epochs) $("train-text").textContent = `epoch ${this.epochs[0]} / ${this.epochs[1]} · ${t.run.state}`;
        this.drawChart();
      }
      if (body.round.state !== "training") {
        if (body.round.state === "labeling") toast("Training failed — " + ((body.round.training || {}).error || "see the run"), "err", 6000);
        return this.refresh();
      }
    } catch (e) { toast(e.message, "err"); }
    this.pollTimer = setTimeout(() => this.pollTrain(), 1500);
  },

    catch (e) { toast(e.message, "err"); }
  },

    if (!keys.length) {
      ctx.fillStyle = "#8b98a5"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
      ctx.fillText("waiting for the first epoch", w / 2, h / 2); $("chart-legend").innerHTML = ""; return;
    }
    const pts = keys.flatMap((k) => this.series[k]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const xMin = Math.min(...xs), xMax = Math.max(...xs, xMin + 1), yMin = Math.min(...ys), yMax0 = Math.max(...ys);
    const yMax = yMax0 === yMin ? yMin + 1 : yMax0;
    const pad = { l: 54, r: 12, t: 12, b: 26 };
    const X = (x) => pad.l + (w - pad.l - pad.r) * (x - xMin) / (xMax - xMin);
    const Y = (y) => pad.t + (h - pad.t - pad.b) * (1 - (y - yMin) / (yMax - yMin));
    ctx.strokeStyle = "#2a333e"; ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui"; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const yv = yMin + (yMax - yMin) * i / 4, y = Y(yv);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.textAlign = "right"; ctx.fillText(fmt(yv), pad.l - 6, y + 4);
    }
    ctx.textAlign = "left"; ctx.fillText("epoch " + xMin, pad.l, h - 8);
    ctx.textAlign = "right"; ctx.fillText("epoch " + xMax, w - pad.r, h - 8);
    keys.forEach((k, i) => {
      ctx.strokeStyle = ctx.fillStyle = PAL[i % PAL.length]; ctx.lineWidth = 2; ctx.beginPath();
      this.series[k].forEach(([x, y], j) => (j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
      ctx.stroke();
      this.series[k].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(X(x), Y(y), 2.5, 0, Math.PI * 2); ctx.fill(); });
    });
    $("chart-legend").innerHTML = keys.map((k, i) => `<span><span class="key" style="background:${PAL[i % PAL.length]}"></span>${k.replace("/loss", " loss")}</span>`).join("");
  },
  // latest validation quality next to the curves: mAP 50 / 50-95, plus F1 when reported
  renderMetricChips() {
    const wanted = [["val/mAP_50", "mAP 50"], ["val/mAP_50_95", "mAP 50-95"], ["val/F1", "F1"]];
    const chips = wanted.filter(([k]) => this.series[k] && this.series[k].length).map(([k, label]) => {
      const pts = this.series[k]; const last = pts[pts.length - 1][1];
      const best = Math.max(...pts.map((p) => p[1]));
      return `<span class="badge"><b style="color:var(--text)">${fmt(last)}</b> ${label}` +
        (best > last + 1e-9 ? ` <span class="muted">· best ${fmt(best)}</span>` : "") + `</span>`;
    });
    $("metric-chips").innerHTML = chips.join("");
  },

  // ------------------------------------------------------------ 4 review
  async renderAdvice(cur) {
    try {
      const a = await api("/loop/advice");
      const tone = { continue: "ok", first_round: "ok", flattening: "warn", check_labels: "err",
                     target_reached: "ok", nothing_left: "warn" }[a.verdict] || "";
      $("advice").className = "advice " + tone;
      $("advice-title").textContent = a.title;
      $("advice-reason").textContent = a.reason;
      $("advice-findings").innerHTML = (a.findings || []).map((t) => `<li>${ICON.warn}<span>${t}</span></li>`).join("");
      // the primary action follows the advice
      const next = $("btn-next-round");
      next.classList.toggle("primary", a.verdict === "continue" || a.verdict === "first_round");
      $("btn-finish").classList.toggle("primary", a.verdict === "target_reached" || a.verdict === "flattening");
    } catch (e) { $("advice-title").textContent = "—"; $("advice-reason").textContent = e.message; }
  },
  renderReview(cur) {
    this.renderAdvice(cur);
    const rows = this.status.rounds;
    const row = cur ? rows.find((r) => r.number === cur.number) : rows.filter((r) => r.metric != null).slice(-1)[0];
    $("metric-value").textContent = row && row.metric != null ? fmt(row.metric) : "—";
    $("metric-key").textContent = row && row.metric_key ? `${row.metric_key} · fixed validation set` : "no metric yet";
    const d = row ? row.delta : null;
    $("metric-delta").innerHTML = d == null ? "" :
      `<span class="${row.improved ? "up" : "down"}">${row.improved ? "▲" : "▼"} ${fmt(Math.abs(d))}</span>`;
    const s = this.status;
    $("review-stats").innerHTML = [
      [row ? row.labels_spent : 0, ICON.tag, "labeled this round"], [s.labeled_images, ICON.tag, "labeled"],
      [s.pool_size, ICON.image, "to label"], [s.skipped_images, ICON.skip, "skipped"],
    ].map(([v, icon, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${icon}${k}</div></div>`).join("");
    $("history-table").innerHTML = this.historyTable(rows);
    $("btn-next-round").disabled = !cur || s.pool_size === 0;
    $("btn-finish").style.display = cur ? "" : "none";
    if (row && row.train_run_id) $("link-evaluate").href = `/evaluate#${row.train_run_id}`;
    this.drawSpark();
  },
  historyTable(rows) {
    if (!rows.length) return '<p class="muted">No rounds yet.</p>';
    return `<table><thead><tr><th>Round</th><th>Step</th><th>How</th><th class="num">Picked</th>
      <th class="num">Labeled</th><th class="num">Skipped</th><th class="num">Metric</th><th class="num">Δ</th></tr></thead><tbody>` +
      rows.map((r) => `<tr><td>${r.number}</td><td>${r.state}</td><td>${(STRATEGY[r.strategy] || ["", ""])[1]}</td>
        <td class="num">${r.picked}</td><td class="num">${r.labels_spent}</td><td class="num">${r.skipped}</td>
        <td class="num">${r.metric == null ? "—" : fmt(r.metric)}</td>
        <td class="num ${r.improved == null ? "" : r.improved ? "up" : "down"}">${r.delta == null ? "" : (r.delta > 0 ? "+" : "") + fmt(r.delta)}</td></tr>`).join("")
      + "</tbody></table>";
  },
  drawSpark() {
    // learning curve: mAP@50 on train / valid / test against labeled photos,
    // one point per round; falls back to the trainer's val mAP for rounds
    // whose split evaluation has not run
    const canvas = $("spark"); if (!canvas.clientWidth) return;
    const rows = this.status.rounds.filter((r) => r.state === "closed" || r.state === "reviewing");
    const series = {};
    for (const r of rows) {
      for (const [split, v] of Object.entries(r.curve || {})) (series[split] = series[split] || []).push([r.labeled_total, v]);
      if (!r.curve || !("valid" in r.curve)) {
        const v = r.metrics["val/ema_mAP_50"] ?? r.metrics["val/mAP_50"];
        if (v != null) (series["valid (training)"] = series["valid (training)"] || []).push([r.labeled_total, v]);
      }
    }
    const evaluating = rows.some((r) => r.evaluating);
    $("curve-note").textContent = evaluating ? "evaluating this round's model on its splits…" : "";
    const order = ["train", "test", "valid", "valid (training)"].filter((k) => series[k] && series[k].length);
    const PAL = { train: "#ffd60a", test: "#30d158", valid: "#8b98a5", "valid (training)": "#5c6670" };
    const THIN = { valid: true, "valid (training)": true };  // checkpoint-selection sets, for reference only
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = 200;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
    if (!order.length) {
      ctx.fillStyle = "#8b98a5"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
      ctx.fillText(evaluating ? "evaluating…" : "the curve appears after the first trained round", w / 2, h / 2);
      $("curve-legend").innerHTML = ""; return;
    }
    const pts = order.flatMap((k) => series[k]);
    const xs = pts.map((p) => p[0]);
    const xMin = Math.min(...xs), xMax = Math.max(...xs, xMin + 1);
    const pad = { l: 44, r: 12, t: 10, b: 26 };
    const X = (x) => pad.l + (w - pad.l - pad.r) * (x - xMin) / (xMax - xMin);
    const Y = (y) => pad.t + (h - pad.t - pad.b) * (1 - Math.min(Math.max(y, 0), 1));
    ctx.strokeStyle = "#2a333e"; ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui"; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const yv = i / 4, y = Y(yv);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.textAlign = "right"; ctx.fillText(yv.toFixed(2), pad.l - 6, y + 4);
    }
    ctx.textAlign = "left"; ctx.fillText(`${xMin} labeled`, pad.l, h - 8);
    ctx.textAlign = "right"; ctx.fillText(`${xMax} labeled`, w - pad.r, h - 8);
    for (const k of order) {
      const p = series[k].slice().sort((a, b) => a[0] - b[0]);
      ctx.strokeStyle = ctx.fillStyle = PAL[k]; ctx.lineWidth = THIN[k] ? 1 : 2.5;
      ctx.setLineDash(THIN[k] ? [4, 4] : []);
      ctx.beginPath(); p.forEach(([x, y], j) => (j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); ctx.stroke();
      ctx.setLineDash([]);
      p.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(X(x), Y(y), THIN[k] ? 2 : 4, 0, Math.PI * 2); ctx.fill(); });
    }
    $("curve-legend").innerHTML = order.map((k) => `<span><span class="key" style="background:${PAL[k]}"></span>${k}</span>`).join("");
    if (evaluating) { clearTimeout(this.curveTimer); this.curveTimer = setTimeout(async () => {
      this.status = await api("/loop"); this.drawSpark(); this.renderAdvice(this.status.current);
    }, 4000); }
  },
};
window.addEventListener("DOMContentLoaded", () => Loop.init().catch((e) => toast(e.message, "err", 6000)));
</script>
</body>
</html>
