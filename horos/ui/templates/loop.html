<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="stylesheet" href="/static/controls.css?v=2">
<script src="/static/controls.js?v=1" defer></script>
<title>horos — annotate</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2129; --line: #2a333e;
    --text: #e6edf3; --dim: #8b98a5; --accent: #0a84ff; --ok: #51cf66; --err: #ff6b6b;
    --warn: #fcc419;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--dim); text-decoration: none; }
  a:hover { color: var(--accent); }
  .btn { background: var(--panel); color: var(--text); border: 1px solid var(--line);
         border-radius: 10px; padding: 8px 16px; cursor: pointer; font-size: 14px;
         display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.primary.big { font-size: 17px; padding: 14px 28px; border-radius: 14px; }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn svg { width: 18px; height: 18px; }
  select, input[type=text] { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  select:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 2px; background: var(--line); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  h4 { margin: 0 0 10px; font-size: 11px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .08em; }

  /* ---- shared site header (identical on every page) ---- */
  .site-header { position: sticky; top: 0; z-index: 40; background: var(--bg);
                 display: flex; align-items: center; gap: 14px;
                 padding: 10px 24px; border-bottom: 1px solid var(--line); }
  .site-header h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  .site-header .project { color: var(--dim); }
  .site-header .page-nav { margin-left: auto; }
  .page-nav { display: flex; gap: 8px; }
  .page-nav a { position: relative; display: flex; align-items: center; justify-content: center;
                width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px;
                color: var(--dim); }
  .page-nav a:hover { border-color: var(--accent); color: var(--accent); }
  .page-nav a[aria-current] { color: var(--text); border-color: var(--accent);
                              background: rgba(77, 171, 247, .12); }
  .page-nav a::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px);
                       right: 0; z-index: 30; background: var(--panel); border: 1px solid var(--line);
                       border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text);
                       white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .page-nav a:hover::after { opacity: 1; }
  .page-nav svg { width: 18px; height: 18px; }

  /* ---- stepper bar: the four steps of a round ---- */
  .steps { display: flex; align-items: center; justify-content: center; gap: 0;
           padding: 22px 16px 10px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--dim); }
  .step .n { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
             display: flex; align-items: center; justify-content: center; font-weight: 600;
             background: var(--bg); }
  .step .n svg { width: 18px; height: 18px; }
  .step .t { font-size: 13px; letter-spacing: .02em; }
  .step.on { color: var(--text); }
  .step.on .n { border-color: var(--accent); color: var(--accent);
                box-shadow: 0 0 0 4px rgba(77, 171, 247, .15); }
  .step.done .n { border-color: var(--ok); color: var(--ok); }
  .step-line { width: 70px; height: 2px; background: var(--line); margin: 0 12px; }
  .step-line.done { background: var(--ok); }

  main { max-width: 1180px; margin: 0 auto; padding: 8px 24px 40px; }
  .panel { display: none; }
  .panel.on { display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--dim); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .stat .k svg { width: 14px; height: 14px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--dim); border: none; padding: 6px 12px;
                cursor: pointer; font-size: 13px; }
  .seg button.on { background: rgba(77, 171, 247, .15); color: var(--accent); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
           border: 1px solid var(--line); font-size: 12px; color: var(--dim); position: relative; }
  .badge svg { width: 14px; height: 14px; }
  .options { justify-content: center; gap: 22px; margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 8px; }
  .opt .k { color: var(--dim); font-size: 12px; }
  .opt select { font-size: 12px; padding: 5px 8px; }
  .badge.accent { border-color: var(--accent); color: var(--accent); }
  .bar { background: var(--line); height: 10px; border-radius: 5px; overflow: hidden; }
  .bar > div { background: var(--accent); height: 100%; width: 0; transition: width .3s; }
  .muted { color: var(--dim); font-size: 12px; }
  .notes { color: var(--dim); font-size: 12px; margin: 8px 0 0; padding-left: 18px; }
  .ring { width: 92px; height: 92px; }
  .label-bar { padding: 8px 14px; }
  /* the slim label bar: badge | progress + hint | actions. The middle shrinks first (the hint
     text is clipped with an ellipsis, the bar keeps 120px); the buttons never shrink and move
     to their own right-aligned line when the card is too narrow for all three parts */
  .label-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .label-head > .badge { flex: none; }
  .label-mid { flex: 1 1 0; min-width: 120px; display: flex; align-items: center; gap: 12px; }
  .label-mid .progress { flex: 1 1 0; min-width: 120px; }
  .label-mid .hint { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
  .label-actions { flex: none; margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .label-actions .btn { flex: none; white-space: nowrap; }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .bar.thin { height: 6px; flex: 1; }
  .bar.thin > div { background: var(--ok); }
  .ring text { fill: var(--text); font-size: 17px; font-weight: 600; }
  .ring .track { stroke: var(--line); }
  .ring .fill { stroke: var(--ok); transition: stroke-dasharray .3s; }
  .label-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; margin-top: 14px; }
  .reasons { margin: 8px 0 0; padding: 0; list-style: none; }
  .reasons li { display: flex; gap: 8px; align-items: center; color: var(--warn); font-size: 12px; margin: 4px 0; }
  .reasons li svg { width: 14px; height: 14px; flex: none; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .name { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line); font-size: 12px;
          color: var(--dim); cursor: pointer; }
  .name.on { border-color: var(--accent); color: var(--accent); }
  #chart { width: 100%; height: 240px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .legend .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--ok); } .down { color: var(--err); }
  .metric-big { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .advice { border-left: 4px solid var(--accent); padding: 6px 14px; border-radius: 6px; background: rgba(10,132,255,.06); }
  .advice.ok { border-color: var(--ok); background: rgba(48,209,88,.08); }
  .advice.warn { border-color: var(--warn); background: rgba(255,214,10,.08); }
  .advice.err { border-color: var(--err); background: rgba(255,69,58,.08); }
  .advice-title { font-size: 20px; font-weight: 600; }
  .advice .reasons li { color: var(--dim); }
  #spark { width: 100%; height: 300px; display: block; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; display: none; z-index: 1200; }
  #toast.warn { border-color: var(--warn); color: var(--warn); }
  #toast.err { border-color: var(--err); color: var(--err); }
  #toast.ok { border-color: var(--ok); color: var(--ok); }
  .tip { position: relative; }
  .tip::after { content: attr(data-tip); position: absolute; left: 50%; transform: translateX(-50%);
                top: calc(100% + 8px); background: var(--panel); border: 1px solid var(--line);
                border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text);
                white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 20; }
  .tip:hover::after { opacity: 1; }
  @media (max-width: 900px) { .label-layout { grid-template-columns: 1fr; } .step .t { display: none; }
                              .step-line { width: 30px; } }
</style>
</head>
<body>

<header class="site-header">
  <h1 style="display:flex;align-items:center;gap:9px">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M7 22 L7 9 Q7 7 9 7 L22 7" fill="none" stroke="#e6edf3"
            stroke-width="4.6" stroke-linecap="round"/>
      <rect x="17" y="17" width="9" height="9" rx="2.2" fill="#4dabf7"/></svg>
    horos</h1>
  <span class="project" id="project-name">—</span>
  <nav class="page-nav">
    <a href="/" data-tip="Dataset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="8" ry="3"/>
        <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
        <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></a>
    <a href="/annotate" data-tip="Annotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></a>
    <a href="/loop" data-tip="Loop" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/>
        <polyline points="21 3 21 9 15 9"/><polyline points="3 21 3 15 9 15"/></svg></a>
    <a href="/train" data-tip="Training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></a>
    <a href="/evaluate" data-tip="Evaluate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg></a>
    <a href="/experiments" data-tip="Experiments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="5" height="9" rx="1"/>
        <rect x="9.5" y="4" width="5" height="16" rx="1"/>
        <rect x="16" y="8" width="5" height="12" rx="1"/></svg></a>
    <a href="/lab" data-tip="Lab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6"/><path d="M10 3v6.5L4.6 18.4A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.6L14 9.5V3"/>
        <path d="M7.5 14h9"/></svg></a>
  </nav>
</header>

<!-- ============================== the four steps ============================== -->
<div class="steps" id="steps">
  <div class="step" data-step="1"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span><span class="t">Select</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="2"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span><span class="t">Label</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="3"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span><span class="t">Train</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="4"><span class="n">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/></svg></span><span class="t">Review</span></div>
</div>

<main>
  <!-- ------------------------------------------------------------ 1 select -->
  <section class="panel card" id="panel-select">
    <div class="stats" id="select-stats"></div>
    <div class="center" style="margin-top:26px">
      <div class="row" style="justify-content:center;width:100%;max-width:640px">
        <div class="seg" id="unit-seg">
          <button class="on" data-unit="count" title="a fixed number of images">#</button>
          <button data-unit="percent" title="a share of the unlabeled pool">%</button>
        </div>
        <input type="range" id="count-slider" class="grow" min="1" max="100" step="1" value="20"
               title="how many photos this round asks you to label — a fixed number (#) or a share of the unlabeled pool (%)">
        <span class="stepper wide"><input type="number" id="count-input" min="1" max="100" step="1" value="20"
               title="photos in this round">
          <span class="step-btns"><button type="button" data-step="1"></button>
            <button type="button" data-step="-1"></button></span></span>
      </div>
      <div class="row" style="justify-content:center">
        <span class="badge tip" id="strategy-badge" data-tip=""></span>
      </div>
      <div class="row options loop-options"></div>
      <button class="btn primary big" id="btn-select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="btn-select-text">Pick 20 photos</span></button>
      <div id="select-progress" style="display:none;width:100%;max-width:640px">
        <div class="bar"><div id="select-bar"></div></div>
        <div class="row" style="margin-top:8px">
          <span class="muted grow" id="select-text">starting…</span>
          <button class="btn danger" id="btn-select-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <a class="btn" href="/annotate" title="Browse and edit every photo">All photos</a>
    </div>
    <details style="margin-top:18px" id="history-details">
      <summary class="muted" style="cursor:pointer">History</summary>
      <div id="history-table-1" style="margin-top:8px"></div>
    </details>
  </section>

  <!-- ------------------------------------------------------------- 2 label -->
  <section class="panel" id="panel-label">
    <!-- a slim bar while labeling: progress + Train; everything else folds away -->
    <div class="card label-bar" id="label-bar">
      <!-- badge | progress + hint (shrinks first) | actions (never shrink; wrap as one group) -->
      <div class="label-head">
        <span class="badge" id="round-badge">round —</span>
        <div class="label-mid">
          <div class="progress" title="labeled photos in this round">
            <div class="bar thin"><div id="ring-fill"></div></div>
            <span class="muted" id="ring-text" style="flex:none;font-variant-numeric:tabular-nums">0/0</span>
          </div>
          <span class="badge tip" id="prelabel-badge" data-tip="" style="display:none;flex:none"></span>
          <span class="muted hint" id="reasons-compact"></span>
        </div>
        <div class="label-actions">
          <a class="btn primary" id="btn-open-annotate" href="/annotate" title="Label this round's photos in the annotate page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Annotate</a>
          <button class="btn" id="btn-train-without" hidden
                  title="Train on the classes that have enough labels; the short ones sit this round out"></button>
          <button class="btn" id="btn-train" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Train</button>
          <button class="btn" id="btn-expand" title="More options" aria-expanded="false" style="padding:8px 10px">
            <svg id="expand-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
      </div>
      <div id="label-more" hidden style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <div class="row options loop-options" style="justify-content:flex-start"></div>
        <div class="row" style="margin-top:12px">
          <input type="text" id="annotators-input" placeholder="Who is labeling? ann, bob" style="width:240px">
          <button class="btn" id="btn-assign" title="Share the round between these people">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
          <div class="names" id="names"></div>
          <span class="grow"></span>
          <a class="btn" href="/annotate" title="Browse and edit every photo">All photos</a>
          <button class="btn" id="btn-discard" title="Drop this round and pick again">↺ Re-pick</button>
        </div>
        <ul class="reasons" id="reasons"></ul>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------- 3 train -->
  <section class="panel card" id="panel-train">
    <div class="row">
      <span class="badge" id="train-badge">round —</span>
      <span class="muted grow" id="train-text">starting…</span>
      <button class="btn danger" id="btn-stop">■ Stop</button>
    </div>
    <div class="bar" style="margin:12px 0"><div id="train-bar"></div></div>
    <div class="row" id="metric-chips" style="margin-bottom:10px;min-height:30px"></div>
    <canvas id="chart"></canvas>
    <div class="legend" id="chart-legend"></div>
  </section>

  <!-- ------------------------------------------------------------ 4 review -->
  <section class="panel card" id="panel-review">
    <div class="advice" id="advice">
      <div class="advice-title" id="advice-title">—</div>
      <div class="muted" id="advice-reason" style="margin-top:4px"></div>
      <ul class="reasons" id="advice-findings" style="margin-top:6px"></ul>
    </div>
    <div class="row" style="align-items:flex-start;margin-top:18px">
      <div class="grow">
        <div class="row" style="align-items:baseline;gap:10px">
          <span class="metric-big" id="metric-value">—</span>
          <span id="metric-delta" style="font-size:20px"></span>
        </div>
        <div class="muted" id="metric-key"></div>
        <h4 style="margin:16px 0 6px">Learning curve</h4>
        <canvas id="spark"></canvas>
        <div class="legend" id="curve-legend"></div>
        <div class="muted" id="curve-note"></div>
      </div>
      <div class="stats" style="min-width:300px" id="review-stats"></div>
    </div>
    <div id="history-table" style="margin-top:16px"></div>
    <div class="row" style="justify-content:center;margin-top:22px;gap:14px">
      <button class="btn primary big" id="btn-next-round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/>
          <polyline points="21 3 21 9 15 9"/><polyline points="3 21 3 15 9 15"/></svg>
        Next round</button>
      <button class="btn" id="btn-finish">✓ Done</button>
      <a class="btn" id="link-evaluate" href="/evaluate">Evaluate</a>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts) => fetch("/api/v1" + path, opts).then(async (r) => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.message || body.error || r.statusText); e.status = r.status; throw e; }
  return body;
});
const json = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
function toast(msg, cls = "warn", ms = 2600) {
  const el = $("toast"); el.textContent = msg; el.className = cls; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = "none"; }, ms);
}
const ICON = {
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>',
  loop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/><polyline points="21 3 21 9 15 9"/><polyline points="3 21 3 15 9 15"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
  spread: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="8" cy="18" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
  dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.2"/><circle cx="16" cy="16" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.1-6"/><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a20.4 20.4 0 0 1-2.2 3.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  robot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="2"/><circle cx="9" cy="14" r="1.5"/><circle cx="15" cy="14" r="1.5"/><path d="M12 8V4"/></svg>',
};
const STRATEGY = {
  diversity: [ICON.spread, "Spread out", "a varied first batch — no labels yet"],
  pal: [ICON.target, "Model-guided", "the model's most uncertain photos, rare classes first"],
  random: [ICON.dice, "Random", "no embedding model available"],
};
const fmt = (v) => v == null ? "—" : Math.abs(v) >= 100 ? v.toFixed(1) : Math.abs(v) >= 1 ? v.toFixed(3) : v.toPrecision(3);

const Loop = {
  status: null, unit: "count", pollTimer: null, jobId: null, seen: 0, series: {}, epochs: null,
  annotator: (() => { try { return localStorage.getItem("horos_annotator") || ""; } catch (e) { return ""; } })(),
  expanded: (() => { try { return localStorage.getItem("horos_label_expanded") === "1"; } catch (e) { return false; } })(),
  setExpanded(on) {
    this.expanded = on;
    $("label-more").hidden = !on;
    $("btn-expand").setAttribute("aria-expanded", on ? "true" : "false");
    $("expand-icon").style.transform = on ? "rotate(180deg)" : "";
    document.body.classList.toggle("label-expanded", on);
    try { localStorage.setItem("horos_label_expanded", on ? "1" : "0"); } catch (e) {}
  },

  async init() {
    const project = await api("/project");
    $("project-name").textContent = project.name;
    $("project-name").title = project.root;
    $("unit-seg").querySelectorAll("button").forEach((b) => { b.onclick = () => this.setUnit(b.dataset.unit); });
    $("count-slider").oninput = (e) => { $("count-input").value = e.target.value; this.syncCount(); };
    $("count-input").addEventListener("input", () => { $("count-slider").value = $("count-input").value; this.syncCount(); });
    $("btn-select").onclick = () => this.select();
    $("btn-select-cancel").onclick = () => this.cancelJob();
    $("btn-assign").onclick = () => this.assign();
    $("btn-train").onclick = () => this.train(false);
    $("btn-train-without").onclick = () => this.train(true);
    $("btn-discard").onclick = () => this.closeRound("Round dropped");
    $("btn-expand").onclick = () => this.setExpanded(!this.expanded);
    this.setExpanded(this.expanded);
    $("btn-stop").onclick = () => this.stop();
    $("btn-next-round").onclick = () => this.closeRound();
    $("btn-finish").onclick = () => this.closeRound("Done", true);
    window.addEventListener("resize", () => { if (this.status) { this.drawChart(); this.drawSpark(); } });
    await this.refresh();
  },

  // ------------------------------------------------------------ state
  async refresh() {
    this.status = await api("/loop");
    const cur = this.status.current;
    const step = !cur || cur.state === "closed" ? 1
      : cur.state === "labeling" ? 2 : cur.state === "training" ? 3 : cur.state === "reviewing" ? 4 : 1;
    this.showStep(step, cur);
    if (step === 1) this.renderSelect();
    // a reload mid-selection: pick the running job back up, or offer a way out
    if (cur && cur.state === "selecting") this.resumeSelect(cur);
    if (step === 2) this.renderLabel(cur);
    if (step === 3) this.renderTrain(cur);
    if (step === 4) this.renderReview(cur);
  },
  showStep(step, cur) {
    document.querySelectorAll(".step").forEach((el) => {
      const n = Number(el.dataset.step);
      el.classList.toggle("on", n === step);
      el.classList.toggle("done", n < step);
    });
    document.querySelectorAll(".step-line").forEach((el, i) => el.classList.toggle("done", i + 1 < step));
    ["select", "label", "train", "review"].forEach((name, i) => $(`panel-${name}`).classList.toggle("on", i + 1 === step));
    clearTimeout(this.pollTimer);
  },

  // ------------------------------------------------------------ 1 select
  setUnit(unit) {
    this.unit = unit;
    $("unit-seg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.unit === unit));
    const pool = this.status.pool_size;
    const max = unit === "count" ? Math.max(1, pool) : 100;
    const value = unit === "count" ? Math.min(20, max) : 10;
    for (const id of ["count-slider", "count-input"]) { $(id).max = max; $(id).value = value; }
    this.syncCount();
  },
  resolvedCount() {
    const v = Number($("count-input").value) || 0;
    const pool = this.status.pool_size;
    return this.unit === "count" ? Math.min(v, pool) : Math.max(1, Math.min(pool, Math.ceil(pool * v / 100)));
  },
  syncCount() {
    const n = this.resolvedCount();
    $("btn-select-text").textContent = `Pick ${n} photo${n === 1 ? "" : "s"}`
      + (this.unit === "percent" ? ` · ${$("count-input").value}%` : "");
    $("btn-select").disabled = n <= 0 || this.status.pool_size === 0;
  },
  models: [],
  OPTIONS_HTML: `      
        <div class="opt">
          <span class="k" title="The model each round trains and, from the second round on, scores the pool with. Auto picks RF-DETR Nano for boxes or RF-DETR-Seg Nano when most labels are polygons; Boxes / Segm let you choose the family and size.">Model</span>
          <div class="seg" data-opt="model">
            <button data-v="auto" title="Boxes → RF-DETR Nano · polygons → RF-DETR-Seg Nano">Auto</button>
            <button data-v="detection" title="detect boxes">Boxes</button>
            <button data-v="instance_segmentation" title="instance segmentation">Segm</button>
          </div>
          <select data-opt="size" style="display:none"></select>
        </div>
        <div class="opt">
          <span class="k" title="Continue: each round's training starts from the previous run of the same model — weights kept, optimizer fresh, class head resized, so new classes are fine — and trains about half the epochs. Fresh: every round trains from the published weights.">Training</span>
          <div class="seg" data-opt="training">
            <button data-v="continue" title="start from the previous run's weights; fewer epochs">Continue</button>
            <button data-v="fresh" title="start from the published weights every round">Fresh</button>
          </div>
        </div>
        <div class="opt">
          <span class="k" title="On: the picked photos arrive pre-labeled by the current model (OWLv2 zero-shot before there is one) as pending suggestions to accept or fix. Off: every photo starts blank.">Pseudo labeling</span>
          <div class="seg" data-opt="suggest">
            <button data-v="1" title="pseudo-label the picked photos">On</button>
            <button data-v="0" title="start every photo blank">Off</button>
          </div>
        </div>
        <div class="opt">
          <span class="k" title="The mAP you want on the held-out test set (0–1). Once a round reaches it and the train and test curves have met, Review says the goal is reached and suggests exporting. Empty or 0 = no goal.">Goal</span>
          <span class="stepper narrow"><input type="number" data-opt="target" min="0" max="1" step="0.05" placeholder="—" title="target mAP on the test set, 0–1; empty or 0 = no goal">
            <span class="step-btns"><button type="button" data-step="1"></button>
              <button type="button" data-step="-1"></button></span></span>
        </div>
        <div class="opt">
          <span class="k" title="How many unlabeled photos the model scores when picking a round, as a multiple of the round size: 20 photos × 100 = 2000 candidates. Bigger pools are sampled at random (fixed seed) and the pick comes from that sample; photos left out can still be chosen for diversity and are sampled in later rounds. Empty or 0 = score them all — the most thorough, and slow on large pools.">Scan ×</span>
          <span class="stepper narrow"><input type="number" data-opt="scan_factor" min="0" step="25" placeholder="all" title="times the round size; empty or 0 = score every photo (slow on large pools)">
            <span class="step-btns"><button type="button" data-step="1"></button>
              <button type="button" data-step="-1"></button></span></span>
        </div>
        <div class="opt">
          <span class="k" title="On: rounds lean towards under-labeled classes — PAL's class budgets are weighted by inverse label frequency, and a class with only a handful of labels (one the model cannot propose yet) gets look-alikes of its few photos, up to a quarter of the round. Off: the paper's budgets alone.">Balance</span>
          <div class="seg" data-opt="balance">
            <button data-v="1" title="favour under-labeled classes">On</button>
            <button data-v="0" title="PAL budgets as in the paper">Off</button>
          </div>
        </div>
        <div class="opt" data-opt="shapes-wrap">
          <span class="k" title="What the pseudo labels look like. Auto follows the model (polygons for a segmentation model, boxes otherwise); Box keeps boxes; Polygon turns box suggestions into SAM polygons.">Shapes</span>
          <div class="seg" data-opt="shapes">
            <button data-v="auto" title="whatever the model produces">Auto</button>
            <button data-v="box" title="boxes only">Box</button>
            <button data-v="polygon" title="boxes become SAM polygons">Polygon</button>
          </div>
        </div>
      `,
  async renderOptions() {
    const st = this.status.settings || {};
    if (!this.models.length) {
      try { this.models = (await api("/models")).filter((m) => m.trainable); } catch (e) { this.models = []; }
    }
    const chosen = this.models.find((m) => m.key === st.model);
    const kind = chosen ? chosen.task : "auto";
    document.querySelectorAll(".loop-options").forEach((root) => {
      root.innerHTML = this.OPTIONS_HTML;
      const seg = (name) => root.querySelector(`[data-opt="${name}"]`);
      const setSeg = (name, v) => seg(name).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(v)));
      setSeg("model", kind);
      setSeg("suggest", st.preannotate === false ? 0 : 1);
      setSeg("training", st.training || "continue");
      setSeg("balance", st.balance === false ? 0 : 1);
      seg("balance").querySelectorAll("button").forEach((b) => { b.onclick = () => this.saveSettings({ balance: b.dataset.v === "1" }); });
      seg("training").querySelectorAll("button").forEach((b) => { b.onclick = () => this.saveSettings({ training: b.dataset.v }); });
      setSeg("shapes", st.shapes || "auto");
      seg("shapes-wrap").style.opacity = st.preannotate === false ? ".4" : "1";
      const size = seg("size");
      if (kind === "auto") size.style.display = "none";
      else {
        const sizes = this.models.filter((m) => m.task === kind);
        size.innerHTML = sizes.map((m) => `<option value="${m.key}" ${m.key === st.model ? "selected" : ""}>${m.display_name.replace(/^RF-DETR(-Seg)? /, "")}</option>`).join("");
        size.style.display = "";
      }
      seg("model").querySelectorAll("button").forEach((b) => { b.onclick = () => {
        const v = b.dataset.v;
        const pick = v === "auto" ? null : (this.models.find((m) => m.task === v && /nano/i.test(m.key)) || this.models.find((m) => m.task === v) || {}).key || null;
        this.saveSettings({ model: pick });
      }; });
      size.onchange = () => this.saveSettings({ model: size.value });
      seg("suggest").querySelectorAll("button").forEach((b) => { b.onclick = () => this.saveSettings({ preannotate: b.dataset.v === "1" }); });
      const goal = root.querySelector('[data-opt="target"]');
      goal.value = st.target == null ? "" : st.target;
      goal.onchange = () => this.saveSettings({ target: goal.value === "" || Number(goal.value) <= 0 ? null : Number(goal.value) });
      const scan = root.querySelector('[data-opt="scan_factor"]');
      scan.value = st.scan_factor == null ? "" : st.scan_factor;
      scan.onchange = () => this.saveSettings({ scan_factor: scan.value === "" || Number(scan.value) <= 0 ? null : Math.round(Number(scan.value)) });
      if (window.horosControls) horosControls.wire(root);
      seg("shapes").querySelectorAll("button").forEach((b) => { b.onclick = () => this.saveSettings({ shapes: b.dataset.v }); });
    });
  },
  async saveSettings(changes) {
    try {
      this.status.settings = await api("/loop/settings", json("PUT", changes));
      await this.renderOptions();
      if (this.status.current && this.status.current.state === "labeling") this.renderLabel(this.status.current);
    } catch (e) { toast(e.message, "err", 4000); }
  },
  renderSelect() {
    const s = this.status;
    this.renderOptions();
    $("select-stats").innerHTML = [
      [s.pool_size, ICON.image, "to label", "unlabeled photos the next round can pick from (skipped ones excluded)"],
      [s.labeled_images, ICON.tag, "labeled", "photos with at least one confirmed label — the training data, split into train / valid / test"],
      [s.skipped_images, ICON.skip, "skipped", "photos an annotator marked unfit for training; out of the pool and of every set"],
      [s.test_images, ICON.check, "held-out test", "labeled photos in the test set: never trained on, the learning curve's honest line"],
      [s.rounds.filter((r) => r.state === "closed").length, ICON.loop, "rounds", "closed rounds so far"],
      [s.has_model ? "✓" : "—", ICON.robot, "model", s.has_model ? "a trained model exists: it scores the pool and pseudo-labels the picks" : "no trained model yet: the first round is spread out by image similarity"],
    ].map(([v, icon, k, tip]) => `<div class="stat" title="${tip}"><div class="v">${v}</div><div class="k">${icon}${k}</div></div>`).join("");
    const [icon, label, tip] = STRATEGY[s.next_strategy] || STRATEGY.random;
    $("strategy-badge").innerHTML = icon + " " + label;
    $("strategy-badge").dataset.tip = tip;
    $("strategy-badge").classList.toggle("accent", s.next_strategy === "pal");
    this.setUnit(this.unit);
    $("select-progress").style.display = "none";
    $("btn-select").style.display = "";
    $("history-table-1").innerHTML = this.historyTable(s.rounds);
    $("history-details").style.display = s.rounds.length ? "" : "none";
    if (s.pool_size === 0) toast(s.total_images ? "Everything is labeled or skipped" : "Add photos on the Dataset page first", "warn", 4000);
  },
  showSelectProgress(text, button, action) {
    $("btn-select").style.display = "none";
    $("select-progress").style.display = "block";
    $("select-bar").style.width = "0"; $("select-text").textContent = text;
    $("btn-select-cancel").textContent = button;
    $("btn-select-cancel").onclick = action;
  },
  async select() {
    const body = { strategy: "auto" };
    if (this.unit === "count") body.count = Number($("count-input").value); else body.percent = Number($("count-input").value);
    try {
      const { job_id } = await api("/loop/rounds", json("POST", body));
      this.jobId = job_id; this.seen = 0;
      this.showSelectProgress("starting… (the first run may download weights)", "Cancel", () => this.cancelJob());
      this.pollSelect();
    } catch (e) { toast(e.message, "err", 4200); }
  },
  resumeSelect(cur) {
    const job = this.status.job;
    if (job && job.kind === "loop-select") {
      // the server is still picking: replay its events from the start so the bar catches up
      this.jobId = job.job_id; this.seen = 0;
      this.showSelectProgress("picking…", "Cancel", () => this.cancelJob());
      this.pollSelect();
      return;
    }
    // no job in flight (the server restarted mid-pick): the round is stuck in "selecting"
    this.jobId = null;
    this.showSelectProgress(`Round ${cur.number} was interrupted before any photo was picked`,
      "Start over", () => this.closeRound("Round dropped"));
  },
  async pollSelect() {
    try {
      const body = await api(`/jobs/${this.jobId}?after=${this.seen}`);
      this.seen = body.num_events;
      for (const ev of body.events) {
        if (ev.type === "progress") {
          $("select-bar").style.width = (ev.total ? 100 * ev.current / ev.total : 0) + "%";
          $("select-text").textContent = `${ev.phase}${ev.message ? " — " + ev.message : ""}`;
        } else if (ev.type === "failed") toast(ev.message, "err", 5000);
      }
      if (body.state === "running") { this.pollTimer = setTimeout(() => this.pollSelect(), 600); return; }
      if (body.state === "completed") toast("Ready to label", "ok");
      await this.refresh();
    } catch (e) { toast(e.message, "err"); await this.refresh(); }
  },
  async cancelJob() {
    if (this.jobId) await api(`/jobs/${this.jobId}/cancel`, json("POST", {})).catch(() => {});
  },

  // ------------------------------------------------------------- 2 label
  async renderLabel(cur) {
    const picks = cur.selection ? cur.selection.picks : [];
    const how = cur.selection ? (STRATEGY[cur.selection.strategy] || STRATEGY.random)[1] : "";
    const st = this.status.settings || {};
    const modelName = st.model ? st.model.replace("rfdetr-", "RF-DETR ").replace("seg-", "Seg ") : "auto model";
    $("round-badge").innerHTML = `${ICON.loop} Round ${cur.number} · ${how} · ${modelName}`;
    await this.renderOptions();
    const pre = cur.preannotation || {};
    $("prelabel-badge").style.display = pre.annotations ? "" : "none";
    $("prelabel-badge").innerHTML = `${ICON.robot} ${pre.annotations} pseudo labels`;
    $("prelabel-badge").dataset.tip = `pseudo-labeled by ${pre.scorer} — accept or fix, no drawing from scratch`;
    const names = [...new Set(picks.map((p) => p.assigned_to).filter(Boolean))];
    $("names").innerHTML = names.map((n) => `<span class="name ${n === this.annotator ? "on" : ""}" data-n="${n}">${n}</span>`).join("");
    $("names").querySelectorAll(".name").forEach((el) => { el.onclick = () => this.setAnnotator(el.dataset.n); });
    if (names.length && !names.includes(this.annotator)) this.annotator = "";
    // labeling happens on the annotate page (the user dropped the embedded
    // canvas, 2026-09-14); progress comes back through the 5 s poll below
    const who = this.annotator ? "&annotator=" + encodeURIComponent(this.annotator) : "";
    $("btn-open-annotate").href = `/annotate?round=${cur.number}${who}`;
    this.updateRing(picks);
    await this.renderReadiness();
    clearTimeout(this.pollTimer);  // renderLabel re-runs after a settings change
    this.pollTimer = setTimeout(() => this.refreshLabel(), 5000);
  },
  async refreshLabel() {
    // other annotators' progress and readiness change without our own saves
    try {
      const status = await api("/loop");
      if (!status.current || status.current.state !== "labeling") { this.status = status; return this.refresh(); }
      this.status = status;
      const row = status.rounds.find((r) => r.number === status.current.number);
      if (row) this.setRing(row.labeled, row.picked - row.skipped);
      await this.renderReadiness();
    } catch (e) {}
    this.pollTimer = setTimeout(() => this.refreshLabel(), 5000);
  },
  setAnnotator(name) {
    this.annotator = name;
    try { localStorage.setItem("horos_annotator", name); } catch (e) {}
    this.renderLabel(this.status.current);
  },
  updateRing(picks) {
    const row = this.status.rounds.find((r) => r.number === this.status.current.number);
    // skipped picks were replaced: the round's size is its active picks
    this.setRing(row ? row.labeled : 0, row ? row.picked - row.skipped : picks.length);
  },
  setRing(done, total) {  // a bar, despite the name the rest of the code uses
    const frac = total ? done / total : 0;
    $("ring-fill").style.width = `${Math.round(100 * frac)}%`;
    $("ring-text").textContent = `${done}/${total}`;
  },
  async renderReadiness() {
    const r = await api("/loop/readiness");
    $("btn-train").disabled = !r.ready;
    $("reasons").innerHTML = r.ready ? "" : r.reasons.map((t) => `<li>${ICON.warn}<span>${t}</span></li>`).join("");
    $("reasons-compact").textContent = r.ready ? "" : r.reasons[0] + (r.reasons.length > 1 ? ` (+${r.reasons.length - 1})` : "");
    $("reasons-compact").title = r.reasons.join("\n");
    $("btn-train").title = r.ready ? `train on ${r.labeled_images} labeled photos` : "not yet — see below";
    // only the per-class minimum blocks: offer to train without those classes
    const without = $("btn-train-without");
    without.hidden = !(r.ready_without_short && !r.ready);
    without.disabled = false;
    if (!without.hidden) {
      const n = r.short_classes.length;
      without.textContent = `Train without ${n} class${n > 1 ? "es" : ""}`;
      without.title = `Train on ${r.labeled_without_short} photos of the classes that have enough labels; `
        + `${r.short_classes.join(", ")} sit this round out and keep collecting labels`;
    }
  },
  async assign() {
    const names = $("annotators-input").value.split(",").map((s) => s.trim()).filter(Boolean);
    if (!names.length) { toast("Type a name or two, comma separated", "warn"); return; }
    try {
      await api(`/loop/rounds/${this.status.current.number}/assign`, json("POST", { annotators: names, reassign: true }));
      if (!this.annotator || !names.includes(this.annotator)) this.setAnnotator(names[0]);
      await this.refresh();
    } catch (e) { toast(e.message, "err", 4000); }
  },
  async train(withoutShort) {
    try {
      $("btn-train").disabled = true; $("btn-train-without").disabled = true;
      await api(`/loop/rounds/${this.status.current.number}/train`,
        json("POST", withoutShort ? { ignore_short_classes: true } : {}));
      this.series = {}; this.epochs = null;
      await this.refresh();
    } catch (e) { toast(e.message, "err", 5000); this.renderReadiness(); }
  },
  async closeRound(message, finish = false) {
    const cur = this.status.current;
    if (!cur) return this.refresh();
    try {
      await api(`/loop/rounds/${cur.number}/close`, json("POST", {}));
      if (message) toast(message, finish ? "ok" : "warn");
      if (finish) { const s = await api("/loop"); this.status = s; this.showStep(4, null); this.renderReview(null); return; }
      await this.refresh();
    } catch (e) { toast(e.message, "err"); }
  },

  // ------------------------------------------------------------- 3 train
  renderTrain(cur) {
    const tr = cur.training || {};
    $("train-badge").innerHTML = `${ICON.loop} round ${cur.number} · ${tr.model || ""}`
      + (tr.ignored_classes && tr.ignored_classes.length ? ` · without ${tr.ignored_classes.join(", ")}` : "")
      + (tr.init_from ? ` · continues ${tr.init_from}` : tr.init_reason ? " · fresh start" : "");
    $("train-badge").title = tr.init_reason || "";
    this.seen = 0; this.series = {}; this.epochs = null;
    $("train-bar").style.width = "0";
    $("metric-chips").innerHTML = "";
    this.drawChart();
    this.pollTrain();
  },
  async pollTrain() {
    const cur = this.status.current;
    try {
      const body = await api(`/loop/rounds/${cur.number}/training?after=${this.seen}`);
      const t = body.training;
      if (t) {
        this.seen = t.num_events;
        for (const ev of t.events) {
          if (ev.type === "metrics") {
            for (const [k, v] of Object.entries(ev.metrics)) (this.series[k] = this.series[k] || []).push([ev.step, v]);
          } else if (ev.type === "progress" && ev.total && /epoch/i.test(ev.phase || "")) {
            this.epochs = [ev.current, ev.total];
            $("train-bar").style.width = (100 * ev.current / ev.total) + "%";
          } else if (ev.type === "progress" && !/epoch/i.test(ev.phase || "")) {
            $("train-text").textContent = ev.phase + (ev.message ? " — " + ev.message : "");
          } else if (ev.type === "warning") toast(ev.message, "warn", 4000);
        }
        if (this.epochs) $("train-text").textContent = `epoch ${this.epochs[0]} / ${this.epochs[1]} · ${t.run.state}`;
        this.drawChart();
      }
      if (body.round.state !== "training") {
        if (body.round.state === "labeling") toast("Training failed — " + ((body.round.training || {}).error || "see the run"), "err", 6000);
        return this.refresh();
      }
    } catch (e) { toast(e.message, "err"); }
    this.pollTimer = setTimeout(() => this.pollTrain(), 1500);
  },
  async stop() {
    const cur = this.status.current;
    if (!cur || !cur.train_run_id) return;
    try { await api(`/train/runs/${cur.train_run_id}/stop`, json("POST", {})); toast("Stopping — best weights are kept", "warn"); }
    catch (e) { toast(e.message, "err"); }
  },
  drawChart() {
    const canvas = $("chart");
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || canvas.parentElement.clientWidth || 600, h = 240;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
    // the two curves that matter; RF-DETR's dozen sub-losses stay out of the picture
    let keys = ["train/loss", "val/loss"].filter((k) => this.series[k]);
    if (!keys.length) keys = Object.keys(this.series).filter((k) => k.toLowerCase() === "loss");
    const PAL = ["#0a84ff", "#30d158", "#ffd60a", "#ff453a"];
    this.renderMetricChips();
    if (!keys.length) {
      ctx.fillStyle = "#8b98a5"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
      ctx.fillText("waiting for the first epoch", w / 2, h / 2); $("chart-legend").innerHTML = ""; return;
    }
    const pts = keys.flatMap((k) => this.series[k]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const xMin = Math.min(...xs), xMax = Math.max(...xs, xMin + 1), yMin = Math.min(...ys), yMax0 = Math.max(...ys);
    const yMax = yMax0 === yMin ? yMin + 1 : yMax0;
    const pad = { l: 54, r: 12, t: 12, b: 26 };
    const X = (x) => pad.l + (w - pad.l - pad.r) * (x - xMin) / (xMax - xMin);
    const Y = (y) => pad.t + (h - pad.t - pad.b) * (1 - (y - yMin) / (yMax - yMin));
    ctx.strokeStyle = "#2a333e"; ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui"; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const yv = yMin + (yMax - yMin) * i / 4, y = Y(yv);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.textAlign = "right"; ctx.fillText(fmt(yv), pad.l - 6, y + 4);
    }
    ctx.textAlign = "left"; ctx.fillText("epoch " + xMin, pad.l, h - 8);
    ctx.textAlign = "right"; ctx.fillText("epoch " + xMax, w - pad.r, h - 8);
    keys.forEach((k, i) => {
      ctx.strokeStyle = ctx.fillStyle = PAL[i % PAL.length]; ctx.lineWidth = 2; ctx.beginPath();
      this.series[k].forEach(([x, y], j) => (j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
      ctx.stroke();
      this.series[k].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(X(x), Y(y), 2.5, 0, Math.PI * 2); ctx.fill(); });
    });
    $("chart-legend").innerHTML = keys.map((k, i) => `<span><span class="key" style="background:${PAL[i % PAL.length]}"></span>${k.replace("/loss", " loss")}</span>`).join("");
  },
  // latest validation quality next to the curves: mAP 50 / 50-95, plus F1 when reported
  renderMetricChips() {
    const wanted = [["val/mAP_50", "mAP 50"], ["val/mAP_50_95", "mAP 50-95"], ["val/F1", "F1"]];
    const chips = wanted.filter(([k]) => this.series[k] && this.series[k].length).map(([k, label]) => {
      const pts = this.series[k]; const last = pts[pts.length - 1][1];
      const best = Math.max(...pts.map((p) => p[1]));
      return `<span class="badge"><b style="color:var(--text)">${fmt(last)}</b> ${label}` +
        (best > last + 1e-9 ? ` <span class="muted">· best ${fmt(best)}</span>` : "") + `</span>`;
    });
    $("metric-chips").innerHTML = chips.join("");
  },

  // ------------------------------------------------------------ 4 review
  async renderAdvice(cur) {
    try {
      const a = await api("/loop/advice");
      const tone = { continue: "ok", first_round: "ok", flattening: "warn", check_labels: "err",
                     target_reached: "ok", nothing_left: "warn" }[a.verdict] || "";
      $("advice").className = "advice " + tone;
      $("advice-title").textContent = a.title;
      $("advice-reason").textContent = a.reason;
      $("advice-findings").innerHTML = (a.findings || []).map((t) => `<li>${ICON.warn}<span>${t}</span></li>`).join("");
      // the primary action follows the advice
      const next = $("btn-next-round");
      next.classList.toggle("primary", a.verdict === "continue" || a.verdict === "first_round");
      $("btn-finish").classList.toggle("primary", a.verdict === "target_reached" || a.verdict === "flattening");
    } catch (e) { $("advice-title").textContent = "—"; $("advice-reason").textContent = e.message; }
  },
  renderReview(cur) {
    this.renderAdvice(cur);
    const rows = this.status.rounds;
    const row = cur ? rows.find((r) => r.number === cur.number) : rows.filter((r) => r.metric != null).slice(-1)[0];
    $("metric-value").textContent = row && row.metric != null ? fmt(row.metric) : "—";
    const SET = (k) => k.startsWith("eval/test/") ? "held-out test set" : k.startsWith("eval/valid/") ? "validation set"
      : k.startsWith("eval/train/") ? "training photos" : "trainer's validation";
    $("metric-key").textContent = row && row.metric_key ? `${row.metric_key} · ${SET(row.metric_key)}` : "no metric yet";
    const d = row ? row.delta : null;
    $("metric-delta").innerHTML = d == null ? "" :
      `<span class="${row.improved ? "up" : "down"}">${row.improved ? "▲" : "▼"} ${fmt(Math.abs(d))}</span>`;
    const s = this.status;
    $("review-stats").innerHTML = [
      [row ? row.labels_spent : 0, ICON.tag, "labeled this round"], [s.labeled_images, ICON.tag, "labeled"],
      [s.pool_size, ICON.image, "to label"], [s.skipped_images, ICON.skip, "skipped"],
    ].map(([v, icon, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${icon}${k}</div></div>`).join("");
    $("history-table").innerHTML = this.historyTable(rows);
    $("btn-next-round").disabled = !cur || s.pool_size === 0;
    $("btn-finish").style.display = cur ? "" : "none";
    if (row && row.train_run_id) $("link-evaluate").href = `/evaluate#${row.train_run_id}`;
    this.drawSpark();
  },
  historyTable(rows) {
    if (!rows.length) return '<p class="muted">No rounds yet.</p>';
    return `<table><thead><tr><th>Round</th><th>Step</th><th>How</th><th class="num">Picked</th>
      <th class="num">Labeled</th><th class="num">Skipped</th><th class="num">Metric</th><th class="num">Δ</th></tr></thead><tbody>` +
      rows.map((r) => `<tr><td>${r.number}</td><td>${r.state}</td><td>${(STRATEGY[r.strategy] || ["", ""])[1]}</td>
        <td class="num">${r.picked}</td><td class="num">${r.labels_spent}</td><td class="num">${r.skipped}</td>
        <td class="num">${r.metric == null ? "—" : fmt(r.metric)}</td>
        <td class="num ${r.improved == null ? "" : r.improved ? "up" : "down"}">${r.delta == null ? "" : (r.delta > 0 ? "+" : "") + fmt(r.delta)}</td></tr>`).join("")
      + "</tbody></table>";
  },
  drawSpark() {
    // learning curve in the classic form: score against training examples,
    // one point per trained round — the training set's mAP@50 (red) and the
    // held-out test set's (green). Train starts high and the two converge as
    // labels accumulate; a gap that stays wide means more data still helps.
    const canvas = $("spark"); if (!canvas.clientWidth) return;
    const rows = this.status.rounds.filter((r) => (r.state === "closed" || r.state === "reviewing") && r.curve);
    const xOf = (r) => r.train_images ?? r.labeled_total;
    const series = { train: [], test: [] };
    for (const r of rows) for (const k of ["train", "test"]) if (k in r.curve) series[k].push([xOf(r), r.curve[k]]);
    for (const k in series) series[k].sort((a, b) => a[0] - b[0]);
    const evaluating = rows.some((r) => r.evaluating);
    const noTest = rows.filter((r) => "train" in r.curve && !("test" in r.curve) && !r.evaluating).map((r) => r.number);
    $("curve-note").textContent = evaluating ? "evaluating this round's model on its splits…"
      : noTest.length ? `Round${noTest.length > 1 ? "s" : ""} ${noTest.join(", ")}: trained before a held-out test set existed — no test score` : "";
    $("curve-legend").innerHTML = "";
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = 300;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
    const pts = [...series.train, ...series.test];
    if (!pts.length) {
      ctx.fillStyle = "#8b98a5"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
      ctx.fillText(evaluating ? "evaluating…" : "the curve appears after the first trained round", w / 2, h / 2);
      return;
    }
    // axes: x spans the training-set sizes with a margin; y fits the scores to a 0.05 grid
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    let xMin = Math.min(...xs), xMax = Math.max(...xs);
    const xPad = Math.max(1, (xMax - xMin) * 0.08); xMin = Math.max(0, xMin - xPad); xMax += xPad;
    let yMin = Math.floor((Math.min(...ys) - 0.02) * 20) / 20, yMax = Math.ceil((Math.max(...ys) + 0.02) * 20) / 20;
    yMin = Math.max(0, yMin); yMax = Math.min(1, yMax); if (yMax - yMin < 0.15) { yMin = Math.max(0, yMax - 0.15); }
    const pad = { l: 52, r: 16, t: 34, b: 44 };
    const X = (x) => pad.l + (w - pad.l - pad.r) * (x - xMin) / (xMax - xMin || 1);
    const Y = (y) => pad.t + (h - pad.t - pad.b) * (1 - (y - yMin) / (yMax - yMin || 1));
    const TEXT = "#e6edf3", DIM = "#8b98a5", GRID = "#2a333e";
    const PAL = { train: "#ff453a", test: "#30d158" }, NAME = { train: "Training score", test: "Test score" };
    // grid + ticks
    ctx.font = "11px system-ui"; ctx.lineWidth = 1;
    const yStep = (yMax - yMin) > 0.3 ? 0.1 : 0.05;
    for (let yv = yMin; yv <= yMax + 1e-9; yv += yStep) {
      const y = Y(yv);
      ctx.strokeStyle = GRID; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.fillStyle = DIM; ctx.textAlign = "right"; ctx.fillText(yv.toFixed(2), pad.l - 8, y + 4);
    }
    const xTicks = [...new Set(xs)].sort((a, b) => a - b);
    const minGap = 44; let lastX = -Infinity;
    for (const xv of xTicks) {
      const x = X(xv);
      ctx.strokeStyle = GRID; ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
      if (x - lastX >= minGap) { ctx.fillStyle = DIM; ctx.textAlign = "center"; ctx.fillText(String(xv), x, h - pad.b + 16); lastX = x; }
    }
    // frame
    ctx.strokeStyle = "#3a4552"; ctx.strokeRect(pad.l, pad.t, w - pad.l - pad.r, h - pad.t - pad.b);
    // titles
    ctx.fillStyle = TEXT; ctx.font = "600 13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Learning curve · mAP@50", pad.l + (w - pad.l - pad.r) / 2, 20);
    ctx.fillStyle = DIM; ctx.font = "11px system-ui";
    ctx.fillText("Training examples", pad.l + (w - pad.l - pad.r) / 2, h - 8);
    ctx.save(); ctx.translate(14, pad.t + (h - pad.t - pad.b) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText("Score", 0, 0); ctx.restore();
    // the gap between the two curves, lightly shaded where both exist
    if (series.train.length > 1 && series.test.length > 1) {
      const byX = (k) => Object.fromEntries(series[k]);
      const common = xTicks.filter((x) => x in byX("train") && x in byX("test"));
      if (common.length > 1) {
        ctx.beginPath();
        common.forEach((x, i) => (i ? ctx.lineTo(X(x), Y(byX("train")[x])) : ctx.moveTo(X(x), Y(byX("train")[x]))));
        common.slice().reverse().forEach((x) => ctx.lineTo(X(x), Y(byX("test")[x])));
        ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fill();
      }
    }
    // lines with round markers
    for (const k of ["train", "test"]) {
      const p = series[k]; if (!p.length) continue;
      ctx.strokeStyle = ctx.fillStyle = PAL[k]; ctx.lineWidth = 2;
      ctx.beginPath(); p.forEach(([x, y], j) => (j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); ctx.stroke();
      p.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(X(x), Y(y), 4.5, 0, Math.PI * 2); ctx.fill(); });
    }
    // legend box in the corner with the fewest points under it
    const items = ["train", "test"].filter((k) => series[k].length);
    ctx.font = "12px system-ui"; ctx.textAlign = "left";
    const lw = Math.max(...items.map((k) => ctx.measureText(NAME[k]).width)) + 44, lh = items.length * 20 + 10;
    const corners = [[w - pad.r - lw - 10, pad.t + 10], [pad.l + 10, pad.t + 10],
                     [w - pad.r - lw - 10, h - pad.b - lh - 10], [pad.l + 10, h - pad.b - lh - 10]];
    const covered = ([cx, cy]) => pts.filter(([x, y]) => X(x) >= cx - 8 && X(x) <= cx + lw + 8 && Y(y) >= cy - 8 && Y(y) <= cy + lh + 8).length;
    const [lx, ly] = corners.reduce((best, c) => covered(c) < covered(best) ? c : best, corners[0]);
    ctx.fillStyle = "rgba(26,33,41,0.92)"; ctx.strokeStyle = "#3a4552";
    ctx.beginPath(); ctx.roundRect(lx, ly, lw, lh, 6); ctx.fill(); ctx.stroke();
    items.forEach((k, i) => {
      const y = ly + 15 + i * 20;
      ctx.strokeStyle = ctx.fillStyle = PAL[k]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(lx + 10, y); ctx.lineTo(lx + 30, y); ctx.stroke();
      ctx.beginPath(); ctx.arc(lx + 20, y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = TEXT; ctx.fillText(NAME[k], lx + 38, y + 4);
    });
    if (evaluating) { clearTimeout(this.curveTimer); this.curveTimer = setTimeout(async () => {
      this.status = await api("/loop"); this.drawSpark(); this.renderAdvice(this.status.current);
    }, 4000); }
  },
};
window.addEventListener("DOMContentLoaded", () => Loop.init().catch((e) => toast(e.message, "err", 6000)));
</script>
</body>
</html>
